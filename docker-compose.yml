version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ekvidya_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ekvidya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: ekvidya_orchestrator
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ekvidya_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/ekvidya?schema=public
      - JWT_SECRET=ekvidya_sih26238_jwt_secret_key_super_secure_123
      - JWT_REFRESH_SECRET=ekvidya_sih26238_refresh_secret_key_456
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - VERIFICATION_SERVICE_URL=http://orchestrator:8000
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_healthy

volumes:
  postgres_data:
